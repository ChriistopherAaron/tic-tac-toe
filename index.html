<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
    </header>

    <main>
        <!-- Start/Names Form -->
         <div id="setup-screen">
            <form id="Player-form">
                <input type="text" id="player1-name" placeholder="Player 1 Name (X)" required>
                <input type="text" id="player2-name" placeholder="Player 2 Name (O)" required>
                <button type="submit">Start Game</button>
            </form>
         </div>
    </main>
    
</body>
</html>
